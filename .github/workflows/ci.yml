name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'repair/**'
      - 'candidate/**'

permissions:
  contents: read

jobs:
  test:
    name: Linux validation + authority Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "25"]
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Record runtime versions
        shell: bash
        run: |
          node --version
          npm --version
          unshare --version
          uname -a

      - name: Record exact candidate identity
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"
          echo "workflow_sha=${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install dependencies
        run: npm ci

      - name: Provision authority namespace sandbox
        shell: bash
        run: |
          set -euo pipefail

          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "0"
          fi

          unshare \
            --user \
            --map-root-user \
            --mount \
            --net \
            -- \
            sh -ceu '
              test "$(id -u)" = "0"
              test ! -s /proc/net/route
            '

      - name: Run complete source, package, installed, and Linux authority gate
        run: npm test

  windows:
    name: Windows validation + packaging Node ${{ matrix.node-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "25"]
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Record exact candidate identity
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          $tree = git rev-parse 'HEAD^{tree}'
          Write-Output "commit=$head"
          Write-Output "tree=$tree"
          Write-Output "workflow_sha=$env:GITHUB_SHA"
          if ($head -ne $env:GITHUB_SHA) { throw "checkout is not bound to GITHUB_SHA" }

      - name: Install dependencies
        run: npm ci

      - name: Run complete portable, package, installed, and zero-side-effect gate
        run: npm test
